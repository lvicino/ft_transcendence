<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Debug Client</title>
  <style>
    body { margin: 0; font-family: monospace; padding: 20px; background: #121212; color: #fff; display: flex; gap: 20px; height: 100vh; box-sizing: border-box; overflow: hidden; }
    h1 { margin-top: 0; font-size: 1.5em; }
    h3 { margin-top: 0; font-size: 1.1em; }
    .col-main { flex: 1; display: flex; flex-direction: column; }
    .col-side { width: 350px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
    input, button { padding: 5px; margin: 2px; background: #333; color: #fff; border: 1px solid #555; font-size: 0.9em; }
    .panel { border: 1px solid #444; padding: 10px; margin-bottom: 15px; background: #1a1a1a; flex-shrink: 0; }
    .panel-side { border: 1px solid #444; padding: 10px; background: #1a1a1a; display: flex; flex-direction: column; flex: 1; }
    .panel-log { flex: 1; display: flex; flex-direction: column; min-height: 0; border: 1px solid #444; padding: 10px; background: #1a1a1a; margin-bottom: 0; }
    #log { flex: 1; overflow-y: scroll; border: 1px solid #555; padding: 10px; background: #000; }
    .list-container { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 10px; background: #000; }
    .list-item { padding: 5px 0; border-bottom: 1px solid #222; }
    .status-online { color: #88ff88; font-weight: bold; }
    .status-offline { color: #ff5555; }
    .msg { margin: 2px 0; }
    .msg-global { color: #88ccff; }
    .msg-private { color: #ff88cc; }
    .msg-system { color: #88ff88; }
    .msg-error { color: #ff5555; }
  </style>
</head>
<body>
  <div class="col-main">
    <h1>Chat Debug Client</h1>

    <div class="panel">
      <h3>1. Authentication</h3>
      <input type="email" id="email" placeholder="Email" value="test@test.com" />
      <input type="text" id="username" placeholder="Username" value="testuser" />
      <input type="password" id="password" placeholder="Password" value="pwd123" />
      <br/>
      <button id="btn-register">Register</button>
      <button id="btn-login">Login</button>
      <button id="btn-oauth" style="background:#6e40c9;">Login with OAuth</button>
      <button id="btn-logout" style="background:#552222;">Logout</button>
      <span id="auth-status" style="margin-left: 10px; color: #88ff88;">Not Logged In</span>
    </div>

    <div class="panel">
      <h3>2. Friend System</h3>
      <input type="number" id="friend-tag" placeholder="User ID (e.g. 5)" style="width: 220px;" />
      <button id="btn-add-friend">Add Friend</button>
      <button id="btn-get-friends">Refresh Friends</button>
      <div id="friends-list" style="margin-top: 10px; font-size: 0.9em; color: #aaa; display: none;"></div>
    </div>

    <div class="panel">
      <h3>3. Chat & WebSocket</h3>
      <span id="ws-status" style="color:#ff5555;">● Disconnected</span>
      <div style="margin-top: 10px;">
        <input type="number" id="receiver-id" placeholder="Receiver ID (Empty for Global)" />
        <input type="text" id="chat-msg" placeholder="Type a message..." style="width: 300px;" />
        <button id="btn-send">Send Message</button>
      </div>
    </div>

    <div class="panel-log">
      <h3>Console / Messages Log</h3>
      <div id="log"></div>
    </div>
  </div>

  <div class="col-side">
    <div class="panel-side">
      <h3>Active Friends</h3>
      <div id="ui-friends-list" class="list-container">Click 'Load Friends' or connect WebSocket.</div>
    </div>
    <div class="panel-side">
      <h3>Online Users (Global)</h3>
      <div id="ui-online-users" class="list-container">Connect WebSocket to view.</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
